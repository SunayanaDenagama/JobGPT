name: Automated Daily Job Scraping & Vector Ingestion

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (05:30 AM Sri Lanka Time)
    - cron: '0 0 * * *'
  # Allows triggering the job manually anytime from the GitHub UI
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Headless Browser Drivers
        run: |
          playwright install --with-deps chromium

      - name: Execute Daily Scraper & Vector Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python sync_jobs.py